<style>
/* Concepto: libreta de cocina medida. Una columna, números en mono como lectura de báscula,
   un solo color de acción (rojo jitomate) y verde/ámbar reservados para el estado de cada día. */
:root {
  --bg: #F8F0E3; --surface: #FFFBF3; --surface2: #F0E4CF; --ink: #2E2218; --muted: #75624F; --line: #E3D2B8;
  --accent: #BF4E28; --accent-ink: #FFFFFF;
  --good: #4D6A2A; --good-bg: #E4EBCD; --warn: #9A5B0C; --warn-bg: #F8E4BE; --bad: #A8281E; --bad-bg: #F6D9D2;
  --f-display: 'Fraunces', 'Iowan Old Style', Georgia, serif;
  --f-body: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, 'Segoe UI', Roboto, sans-serif;
  --f-mono: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, 'Segoe UI', Roboto, sans-serif;
  --f-code: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --glass-rgb: 255 251 243; --glass-o: 0.62; --hi: rgba(255, 255, 255, 0.7); --lo: rgba(70, 40, 15, 0.16); --shade: rgba(60, 30, 8, 0.32);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1D1710; --surface: #271F16; --surface2: #33291D; --ink: #F4E8D3; --muted: #B3A088; --line: #3D3224;
    --accent: #E9835B; --accent-ink: #26120A;
    --good: #A9C26B; --good-bg: #2B3317; --warn: #E7B25C; --warn-bg: #3B2D12; --bad: #F0968B; --bad-bg: #3F1F1B;
    --glass-rgb: 39 31 22; --hi: rgba(255, 255, 255, 0.2); --lo: rgba(0, 0, 0, 0.55); --shade: rgba(0, 0, 0, 0.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1D1710; --surface: #271F16; --surface2: #33291D; --ink: #F4E8D3; --muted: #B3A088; --line: #3D3224;
  --accent: #E9835B; --accent-ink: #26120A;
  --good: #A9C26B; --good-bg: #2B3317; --warn: #E7B25C; --warn-bg: #3B2D12; --bad: #F0968B; --bad-bg: #3F1F1B;
  --glass-rgb: 39 31 22; --hi: rgba(255, 255, 255, 0.2); --lo: rgba(0, 0, 0, 0.55); --shade: rgba(0, 0, 0, 0.6);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 400 15px/1.5 var(--f-body); padding-block: 0; }
button, input, select { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.15; }
.num, .mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap { max-width: 720px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 110px; }
.top { display: flex; flex-direction: column; gap: 4px; padding-bottom: 16px; }
.top h1 { font-size: 30px; font-weight: 700; letter-spacing: -0.01em; }
.top .sub { color: var(--muted); font-size: 13px; }
.top .sub b { color: var(--ink); font-weight: 500; }

.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; justify-content: center; background: var(--surface); border-top: 1px solid var(--line); padding: 6px max(16px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.tabs-in { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; width: 100%; max-width: 720px; }
.tabs a { text-align: center; padding: 10px 2px; border-radius: 10px; color: var(--muted); text-decoration: none; font-weight: 600; font-size: 13px; }
.tabs a[aria-current="page"] { background: var(--ink); color: var(--bg); }

.banner { background: var(--warn-bg); color: var(--ink); border: 1px solid var(--line); border-left: 4px solid var(--warn); padding: 10px 12px; border-radius: 8px; margin-bottom: 14px; font-size: 14px; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; }
.banner p { margin: 0; flex: 1 1 220px; min-width: 0; }

.btn { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 9px; padding: 10px 14px; font-weight: 600; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn.small { padding: 6px 10px; font-size: 13px; }
.btn:disabled { opacity: 0.5; cursor: default; }

.days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; margin-bottom: 14px; }
.daypill { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; cursor: pointer; }
.daypill .dw { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.daypill .dn { font-family: var(--f-mono); font-size: 17px; font-weight: 500; }
.daypill .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--good); }
.daypill .dot.off { background: var(--warn); }
.daypill[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.daypill[aria-selected="true"] .dw { color: inherit; opacity: 0.75; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
.dayhead { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; justify-content: space-between; margin-bottom: 14px; }
.dayhead h2 { font-size: 22px; }
.pill { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--good-bg); color: var(--good); }
.pill.part { background: var(--line); color: var(--muted); }
.daypill .dot.part { background: var(--line); border: 1px solid var(--muted); width: 6px; height: 6px; box-sizing: border-box; }
.fill.part { opacity: 0.55; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 999px; padding: 7px 13px; font-size: 14px; font-weight: 600; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.meal.empty { padding: 12px 0; }
.meal.empty .slot { display: block; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 8px; }
.pill.off { background: var(--warn-bg); color: var(--warn); }
.pill.bad { background: var(--bad-bg); color: var(--bad); }
.tag { font-size: 12px; color: var(--muted); }

.meters { display: grid; gap: 14px; margin-bottom: 8px; }
.mhead { display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; margin-bottom: 6px; }
.mhead span { font-size: 13px; color: var(--muted); }
.mhead b { font-family: var(--f-mono); font-weight: 500; font-size: 18px; }
.mhead small { color: var(--muted); margin-left: auto; font-size: 12px; }
.track { position: relative; height: 14px; background: var(--surface2); border-radius: 7px; }
.zone { position: absolute; top: 0; bottom: 0; background: var(--good-bg); border-left: 1.5px solid var(--good); border-right: 1.5px solid var(--good); }
.fill { position: absolute; left: 0; top: 4px; height: 6px; border-radius: 3px; background: var(--good); }
.fill.off { background: var(--warn); }
.tick { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); opacity: 0.6; }
.legend { font-size: 12px; color: var(--muted); margin: 6px 0 0; }

.meals { list-style: none; margin: 14px 0 0; padding: 0; border-top: 1px solid var(--line); }
.meal { border-bottom: 1px solid var(--line); }
.mhd { width: 100%; background: none; border: 0; text-align: left; padding: 12px 0; cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: baseline; }
.mhd .slot { grid-column: 1 / 3; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; }
.mhd .mname { font-weight: 600; font-size: 16px; min-width: 0; }
.mhd .mnum { font-family: var(--f-mono); font-size: 13px; color: var(--muted); text-align: right; }
.mbody { padding: 0 0 14px; }
.ing { list-style: none; margin: 0 0 8px; padding: 0; display: grid; gap: 8px; }
.irow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 12px; align-items: baseline; }
.iname { font-weight: 500; min-width: 0; }
.iqty { font-family: var(--f-mono); font-size: 13px; text-align: right; }
.imath { grid-column: 1 / 3; font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); word-break: break-word; }
.msum { font-family: var(--f-mono); font-size: 13px; padding: 8px 0; border-top: 1px dashed var(--line); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.how { color: var(--muted); font-size: 14px; margin: 4px 0 10px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }

.totbox { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 12px; }
.tot { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.tot span { display: block; font-size: 12px; color: var(--muted); }
.tot b { font-family: var(--f-mono); font-weight: 500; font-size: 24px; }
.tot small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
.sec { margin: 22px 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-family: var(--f-body); font-weight: 600; }
.slist { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.srow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 12px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: start; }
.srow.is-bought .sname { text-decoration: line-through; color: var(--muted); }
.srow.is-pantry .sprice b { color: var(--muted); text-decoration: line-through; }
.sname { font-weight: 600; display: block; }
.sinfo small { color: var(--muted); font-size: 12.5px; display: block; }
.sprice { text-align: right; }
.sprice b { font-family: var(--f-mono); font-weight: 500; }
.sub-row { grid-column: 2 / 4; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 13px; }
.link { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; cursor: pointer; font-size: 13px; }
.chk input, .pant input, .form input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--accent); margin: 2px 0 0; }
.chk-sp { width: 20px; }
.crrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); list-style: none; }
.crrow select, .crrow input { background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: inherit; font-size: 14px; min-width: 0; max-width: 100%; }
.crrow input { width: 84px; }
.crrow .u { color: var(--muted); }
.pickbtn { flex: 1 1 150px; min-width: 0; max-width: 100%; text-align: left; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px 28px 8px 10px; font: inherit; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; position: relative; }
.pickbtn::after { content: "⌕"; position: absolute; right: 9px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.pickbtn:focus-visible { outline: 2px solid var(--accent, #c4552d); outline-offset: 2px; }
.priceedit .pickbtn { padding: 9px 28px 9px 10px; flex: 1 1 170px; }
.pklist { list-style: none; padding: 0; margin: 8px 0 0; max-height: min(52vh, 460px); overflow-y: auto; border-top: 1px solid var(--line); overscroll-behavior: contain; }
.pkrow { display: block; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 10px 4px; font: inherit; color: var(--ink); cursor: pointer; min-height: 44px; }
.pkrow b { display: block; font-weight: 600; overflow-wrap: anywhere; }
.pkrow small { display: block; color: var(--muted); font-size: 12.5px; }
.pkrow:hover, .pkrow:focus-visible { background: color-mix(in srgb, var(--accent, #c4552d) 9%, transparent); outline: none; }
.pkhead { position: sticky; top: 0; z-index: 1; background: var(--surface); color: var(--muted); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; padding: 8px 4px 6px; border-bottom: 1px solid var(--line); }
.pkempty { color: var(--muted); padding: 14px 4px; }
.cand[hidden] { display: none; }
.crlist { margin: 6px 0 0; padding: 0; }
.isub { padding: 0 0 10px; }
.wl { margin: 6px 0 0; padding: 0; }
.wl li { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 8px 0; border-top: 1px solid var(--line); list-style: none; }
details.calc { background: var(--surface2); border-radius: 12px; padding: 10px 12px; }
details.calc summary { cursor: pointer; font-weight: 600; }
details.calc select, details.calc input { background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; }
.stk { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); }
.stk input { width: 84px; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; font: inherit; font-size: 13px; }
.spend { display: block; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; margin-bottom: 14px; color: var(--ink); text-decoration: none; }
.spend span { display: block; font-size: 12px; color: var(--muted); }
.spend b { font-family: var(--f-mono); font-weight: 500; font-size: 22px; }
.spend small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
.pant { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); }
.pant input { width: 16px; height: 16px; margin: 0; }
.priceedit { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.form { display: grid; gap: 16px; }
.fgroup { display: grid; gap: 12px; }
.fgroup h2 { font-size: 18px; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
.fld { display: grid; gap: 4px; min-width: 0; }
.fld label, .lbl { font-size: 13px; color: var(--muted); }
.fld textarea { width: 100%; min-width: 0; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; font: inherit; resize: vertical; }
.fld input, .fld select { width: 100%; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; }
.checks { display: grid; gap: 8px; }
.checks label { display: flex; gap: 10px; align-items: center; }
.hint { color: var(--muted); font-size: 13px; margin: 0; }
.target { background: var(--ink); color: var(--bg); border-radius: 14px; padding: 16px; display: grid; gap: 4px; }
.target b { font-family: var(--f-mono); font-weight: 500; font-size: 26px; }
.target small { opacity: 0.8; }
.foot { margin-top: 28px; color: var(--muted); font-size: 12.5px; display: grid; gap: 6px; }

.sheet { position: fixed; inset: 0; z-index: 20; background: rgba(8, 12, 10, 0.55); display: flex; align-items: flex-end; justify-content: center; }
.sheet[hidden] { display: none; }
.sheet-card { background: var(--surface); width: 100%; max-width: 720px; max-height: 88vh; overflow-y: auto; border-radius: 16px 16px 0 0; padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sheet-card h2 { font-size: 20px; margin-bottom: 4px; }
.cands { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 0; border-top: 1px solid var(--line); }
.cand { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 12px; padding: 12px 0; border-bottom: 1px solid var(--line); align-items: center; }
.cand b { display: block; }
.cand small { color: var(--muted); display: block; }
.after { font-family: var(--f-mono); font-size: 12.5px; margin-top: 4px; }
.sheet-head { display: flex; justify-content: space-between; gap: 12px; align-items: start; }

@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; animation: none !important; } }
@media (min-width: 560px) { .mhd .mnum { font-size: 14px; } }

/* ---------- rediseño cálido ---------- */
.wrap { max-width: 1080px; }
.top { position: relative; padding-bottom: 20px; }
.eyebrow { font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
.top h1 { font-size: clamp(34px, 8vw, 52px); font-weight: 700; letter-spacing: -0.02em; line-height: 1.02; }
.top::after { content: ""; display: block; height: 6px; margin-top: 14px; border-radius: 4px; opacity: 0.9;
  background: repeating-linear-gradient(90deg, var(--accent) 0 14px, transparent 14px 18px, var(--good) 18px 32px, transparent 32px 36px); }
.v-ajustes, .v-compras, .v-progreso { max-width: 760px; margin-inline: auto; }
.tabs a { border-radius: 999px; }
.tabs a[aria-current="page"] { background: var(--accent); color: var(--accent-ink); }
.btn { border-radius: 999px; padding: 11px 18px; }
.btn.small { padding: 7px 13px; }
.card { border-radius: 22px; padding: 20px; box-shadow: 0 1px 0 var(--line), 0 14px 28px -22px rgba(70, 40, 10, 0.45); }
.fld input, .fld select, .fld textarea { border-radius: 12px; }
.tot, .spend, .meter { border-radius: 20px; }
.tot b, .spend b, .target b { font-family: var(--f-display); font-weight: 600; }
.tot b { font-size: 30px; }
.target { background: var(--ink); color: var(--bg); border-radius: 22px; }

.thumb { display: block; flex: none; width: 64px; height: 64px; border-radius: 18px; background-size: cover; background-position: center; background-color: var(--surface2); box-shadow: inset 0 0 0 1px rgba(60, 30, 10, 0.08); }
.thumb.big { width: 88px; height: 88px; border-radius: 24px; }
.thumb.dim { filter: grayscale(0.6) opacity(0.75); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .thumb, :root:not([data-theme="light"]) .hero-img { filter: brightness(0.9); } }
:root[data-theme="dark"] .thumb, :root[data-theme="dark"] .hero-img { filter: brightness(0.9); }

.meals { border-top: 0; display: grid; gap: 10px; margin-top: 16px; }
.meal { border: 1px solid var(--line); border-radius: 18px; padding: 2px 14px; background: var(--surface); }
.meal.empty { border-style: dashed; background: transparent; padding: 12px 14px; }
.mhd { grid-template-columns: 64px minmax(0, 1fr) auto; gap: 2px 14px; align-items: center; }
.mhd .thumb { grid-row: 1 / 3; grid-column: 1; }
.mhd .slot { grid-column: 2 / 4; grid-row: 1; }
.mhd .mname { grid-column: 2; grid-row: 2; font-family: var(--f-display); font-weight: 600; font-size: 17px; line-height: 1.2; }
.mhd .mnum { grid-column: 3; grid-row: 2; }
@media (max-width: 520px) {
  .mhd { grid-template-columns: 64px minmax(0, 1fr); }
  .mhd .thumb { grid-row: 1 / 4; }
  .mhd .slot { grid-column: 2; }
  .mhd .mnum { grid-column: 2; grid-row: 3; text-align: left; }
}
.mbody { padding-bottom: 14px; }

.meters { grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 4px; }
.rmeter { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; background: var(--surface2); border-radius: 20px; padding: 14px 10px; min-width: 0; }
.ring { flex: none; display: block; }
.ring .rt { font: 500 17px var(--f-mono); fill: var(--ink); }
.rmeter .mtxt { display: grid; gap: 0; min-width: 0; }
.rmeter .mtxt span { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
.rmeter .mtxt b { font: 500 20px var(--f-mono); }
.rmeter .mtxt small { font-size: 12px; color: var(--muted); }

   Precios medidos con tickets de la gente: tienda → producto → [precio por paquete, tickets]; factores de tienda → [factor, tickets]. */
const COMMUNITY = { updated: '', prices: {}, factors: {} };

/* Motor del plan: metas, solución por día, búsqueda de combinaciones. Sin DOM. */
const DISH = Object.fromEntries(DISHES.map(d => [d.id, d]));
const SLOTS_ALL = ['des', 'com', 'cen', 'sna'];
const SLOT_NAME = { des: 'Desayuno', com: 'Comida', cen: 'Cena', sna: 'Colación' };
const DIETS = { todo: [], sincerdo: ['cerdo'], sinroja: ['res', 'cerdo'], vegetariano: ['res', 'cerdo', 'pollo', 'pescado'] };

function clamp(x, a, b) { return Math.max(a, Math.min(b, x)); }
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* Metas diarias: Mifflin-St Jeor × actividad, ajuste por objetivo, proteína por kg. */
function targets(cfg) {
  const bmr = 10 * cfg.peso + 6.25 * cfg.talla - 5 * cfg.edad + (cfg.sexo === 'h' ? 5 : -161);
  const tdee = bmr * cfg.act;
  const adj = { bajar: -0.18, mantener: 0, subir: 0.10 }[cfg.meta];
  const pk = { bajar: 1.8, mantener: 1.6, subir: 1.8 }[cfg.meta];
  const kAuto = clamp(Math.round(tdee * (1 + adj) / 10) * 10, 1400, 4500);
  const pAuto = clamp(Math.round(cfg.peso * pk / 5) * 5, 50, 260);
  const k = cfg.kOv ? clamp(Math.round(cfg.kOv), 1200, 4500) : kAuto;
  const p = cfg.pOv ? clamp(Math.round(cfg.pOv), 40, 300) : pAuto;
  return { bmr, tdee, kAuto, pAuto, k, p };
}

function excludedTags(cfg) {
  const t = new Set(DIETS[cfg.dieta] || []);
  (cfg.excl || []).forEach(x => t.add(x));
  return t;
}
function dishAllowed(d, ex) { return d.ing.every(i => !FOODS[i.f].tags.some(t => ex.has(t))); }
function poolsFor(cfg) {
  const ex = excludedTags(cfg), o = {};
  for (const s of SLOTS_ALL) o[s] = DISHES.filter(d => d.slot === s && dishAllowed(d, ex));
  return o;
}
function shares(withSnack) {
  return withSnack ? { des: 0.25, com: 0.35, cen: 0.30, sna: 0.10 } : { des: 0.27, com: 0.40, cen: 0.33 };
}

function roundG(food, g) {
  if (food.unitG) return Math.max(1, Math.round(g / food.unitG)) * food.unitG;
  const st = food.step || 5;
  return Math.max(st, Math.round(g / st) * st);
}
function itemFor(id, g) {
  const fd = FOODS[id];
  return { f: id, g, k: fd.k * g / 100, p: fd.p * g / 100, c: fd.c * g / 100, fat: fd.fat * g / 100 };
}
function sumItems(items) {
  return items.reduce((s, i) => ({ k: s.k + i.k, p: s.p + i.p, c: s.c + i.c, fat: s.fat + i.fat }), { k: 0, p: 0, c: 0, fat: 0 });
}

/* Clase de un alimento según lo que aporta: P proteína (se ajusta), B base (se ajusta), V fija (verduras y fruta de pocas calorías). */
function foodClass(id) {
  const f = FOODS[id];
  if (f.p >= 8 && f.p * 4 / f.k >= 0.20) return 'P';
  if (f.k < 70) return 'V';
  return 'B';
}
/* Ingredientes efectivos de un platillo, con las sustituciones de ese día: subs = { alimentoOriginal: alimentoNuevo }. */
function subGrams(ing, to) {
  const a = FOODS[ing.f], b = FOODS[to];
  const g = ing.r === 'P' && a.p > 0 && b.p > 0 ? ing.g * a.p / b.p : ing.g * a.k / Math.max(1, b.k);
  return Math.round(Math.min(800, Math.max(5, g)));
}
function effIng(dishId, subs) {
  const base = DISH[dishId].ing;
  if (!subs) return base;
  return base.map(ing => { const to = subs[ing.f]; return to && FOODS[to] ? { f: to, g: subGrams(ing, to), r: ing.r } : ing; });
}

/* Resuelve dos escalas: a para ingredientes P (proteína) y b para B (base), de modo que el día llegue a K kcal y P g de proteína. */
function solveScales(defs, K, P) {
  let Kf = 0, Pf = 0, Kp = 0, Pp = 0, Kb = 0, Pb = 0;
  for (const m of defs) {
    if (m.out) { Kf += m.out.k; Pf += m.out.p; continue; }
    for (const ing of effIng(m.dish, m.subs)) {
      const fd = FOODS[ing.f], k = fd.k * ing.g / 100, p = fd.p * ing.g / 100;
      if (ing.r === 'P') { Kp += k; Pp += p; } else if (ing.r === 'B') { Kb += k; Pb += p; } else { Kf += k; Pf += p; }
    }
  }
  const K2 = K - Kf, P2 = P - Pf;
  if (Kp + Kb < 1e-6) return { a: 1, b: 1, fixedOnly: true };
  const det = Kp * Pb - Kb * Pp;
  if (Math.abs(det) > 0.03 * (Kp * Pb + Kb * Pp)) {
    return { a: (K2 * Pb - Kb * P2) / det, b: (Kp * P2 - K2 * Pp) / det };
  }
  const s = K2 / (Kp + Kb);
  return { a: s, b: s };
}

function buildMeal(slot, dishId, a, b, subs) {
  const items = effIng(dishId, subs).map(ing => {
    const mult = ing.r === 'P' ? a : ing.r === 'B' ? b : 1;
    return itemFor(ing.f, roundG(FOODS[ing.f], ing.g * mult));
  });
  return { slot, dish: dishId, items, ...sumItems(items) };
}

/* defs: [{slot, dish} | {slot, out:{k,p,label}}]. Devuelve el día con totales y estado. */
function evalDay(defs, K, P) {
  const sc = solveScales(defs, K, P);
  const hasOut = defs.some(m => m.out);
  const sh = shares(defs.some(m => m.slot === 'sna'));
  const meals = defs.map(m => m.out
    ? { slot: m.slot, out: m.out, items: [], k: m.out.k, p: m.out.p, c: 0, fat: 0 }
    : buildMeal(m.slot, m.dish, sc.a, sc.b, m.subs));
  const tot = sumItems(meals);
  const errK = (tot.k - K) / K, errP = (tot.p - P) / P;
  const kOK = Math.abs(errK) <= 0.05;
  const pOK = tot.p >= 0.95 * P && tot.p <= 1.3 * P;
  const scaleOK = sc.a >= 0.4 && sc.a <= 2.6 && sc.b >= 0.4 && sc.b <= 2.6;
  let rangeOK = true;
  if (!hasOut) for (const m of meals) { const rel = m.k / (K * (sh[m.slot] || 0.1)); if (rel < 0.5 || rel > 1.6) rangeOK = false; }
  return { meals, tot, a: sc.a, b: sc.b, errK, errP, kOK, pOK, scaleOK, rangeOK, ok: kOK && pOK && scaleOK && rangeOK };
}

function weightedPick(list, used, rng) {
  const w = list.map(d => 1 / Math.pow(1 + (used[d.id] || 0), 2));
  let r = rng() * w.reduce((x, y) => x + y, 0);
  for (let i = 0; i < list.length; i++) { r -= w[i]; if (r <= 0) return list[i].id; }
  return list[list.length - 1].id;
}

function dishFoods(id) { return DISH[id].ing.map(i => i.f); }

/* Busca una combinación que cumpla la banda del día. Prefiere platillos poco repetidos, ingredientes que ya se compran esa semana
   (cada ingrediente nuevo obliga a comprar un paquete completo) y ingredientes que ya hay en casa. */
function findDay(pools, slots, fixed, used, usedFoods, have, K, P, rng) {
  let best = null, bestScore = Infinity, passes = 0;
  for (let t = 0; t < 500; t++) {
    const pick = {};
    for (const s of slots) pick[s] = fixed && fixed[s] ? fixed[s] : weightedPick(pools[s], used, rng);
    const ev = evalDay(slots.map(s => ({ slot: s, dish: pick[s] })), K, P);
    const rep = slots.reduce((n, s) => n + (fixed && fixed[s] ? 0 : (used[pick[s]] || 0)), 0);
    const fresh = new Set(), home = new Set();
    for (const s of slots) if (!(fixed && fixed[s])) for (const f of dishFoods(pick[s])) {
      if (FOODS[f].price < 20) continue;
      if (have.has(f)) home.add(f); else if (!usedFoods.has(f)) fresh.add(f);
    }
    const score = (ev.ok ? 0 : 1000) + Math.abs(ev.errK) * 100 + Math.max(0, -ev.errP) * 100 + rep * 2 + fresh.size * 1.6 - home.size * 0.8;
    if (score < bestScore) { bestScore = score; best = { pick, ev }; }
    if (ev.ok && ++passes >= 60) break;
  }
  return best;
}

/* Arma 7 días. Con repeat > 1, comida y cena se repiten en bloques de ese tamaño. */
function planWeek(cfg, tg, seed, have) {
  const rng = mulberry32(seed), pools = poolsFor(cfg);
  const warns = [];
  for (const s of ['des', 'com', 'cen']) {
    if (!pools[s].length) return { error: `Con esas restricciones no queda ningún platillo de ${SLOT_NAME[s].toLowerCase()}. Quita alguna restricción.` };
    if (pools[s].length < 3) warns.push(pools[s].length === 1
      ? `Solo hay 1 opción de ${SLOT_NAME[s].toLowerCase()}, así que se repetirá todos los días.`
      : `Solo hay ${pools[s].length} opciones de ${SLOT_NAME[s].toLowerCase()}, así que se repetirán.`);
  }
  let snack = !!cfg.snack;
  if (snack && !pools.sna.length) { snack = false; warns.push('Con esas restricciones no hay colaciones, así que el plan va sin ellas.'); }
  const slots = snack ? SLOTS_ALL : ['des', 'com', 'cen'];
  const used = {}, usedFoods = new Set(have || []), home = have || new Set(), days = [];
  for (let d = 0; d < 7; d++) {
    let fixed = null, repeatOf = null;
    if (cfg.repeat > 1 && d % cfg.repeat !== 0) {
      repeatOf = d - (d % cfg.repeat);
      fixed = { com: days[repeatOf].dishes.com, cen: days[repeatOf].dishes.cen };
    }
    const r = findDay(pools, slots, fixed, used, usedFoods, home, tg.k, tg.p, rng);
    for (const s of slots) { if (!(fixed && fixed[s])) used[r.pick[s]] = (used[r.pick[s]] || 0) + 1; dishFoods(r.pick[s]).forEach(f => usedFoods.add(f)); }
    days.push({ dishes: r.pick, repeatOf });
  }
  return { days, warns, snack };
}

/* Comidas que se esperan en un día completo. */
function expectedSlots(cfg) {
  return ['des', 'com', 'cen'].concat(cfg.snack && poolsFor(cfg).sna.length ? ['sna'] : []);
}
/* Día con cualquier cantidad de comidas elegidas. Si faltan comidas, cada una se dimensiona a su parte de la meta del día

    const t = ev.partial ? { k: ev.fK, p: ev.fP } : tg;
    const miss = ev.missing && ev.missing.length ? 'Faltan: ' + ev.missing.map(x => SLOT_NAME[x].toLowerCase()).join(', ') : '';
    if (ev.ok) return { cls: miss ? 'part' : '', txt: miss || 'Dentro de banda' };
    const why = [];
    if (ev.partial) {
      if (!ev.scaleOK) why.push('hay porciones poco realistas');
      if (!ev.kOK) why.push(ev.tot.k > ev.fK ? 'llevas ' + fmtN(ev.tot.k - ev.fK) + ' kcal más de lo que toca a esas comidas' : 'llevas ' + fmtN(ev.fK - ev.tot.k) + ' kcal menos de lo que toca a esas comidas');
    } else {
      if (!ev.kOK) why.push((ev.tot.k > t.k ? '+' : '') + fmtN(ev.tot.k - t.k) + ' kcal');

      else if (ev.tot.p > 1.3 * t.p) why.push(fmtN(ev.tot.p - 1.3 * t.p) + ' g de proteína de más');

    const C = 2 * Math.PI * 34, f = Math.min(val / (target * max), 1), col = partial ? 'var(--muted)' : inBand ? 'var(--good)' : 'var(--warn)';
    const aria = (isK ? 'Calorías' : 'Proteína') + ': ' + fmtN(val) + ' de ' + fmtN(target) + (partial ? ', día incompleto' : inBand ? ', dentro de la banda' : ', fuera de la banda');
    const svg = '<svg class="ring" width="84" height="84" viewBox="0 0 88 88" role="img" aria-label="' + aria + '"><g transform="rotate(-90 44 44)">' +
      '<circle cx="44" cy="44" r="34" fill="none" stroke="var(--surface)" stroke-width="10"/>' +
      '<circle cx="44" cy="44" r="34" fill="none" stroke="var(--good-bg)" stroke-width="10" stroke-dasharray="' + ((hi - lo) / max * C).toFixed(1) + ' ' + C.toFixed(1) + '" stroke-dashoffset="' + (-lo / max * C).toFixed(1) + '"/>' +

      '<line x1="71" y1="44" x2="85" y2="44" stroke="var(--ink)" stroke-width="2" opacity="0.65" transform="rotate(' + (360 / max).toFixed(1) + ' 44 44)"/></g>' +

  /* ---------- buscador de ingredientes ---------- */
  let pk = null, addPick = '', addG = '';
  const foodName = (id, buy) => { const f = FOODS[id]; return f ? ((buy && f.buy) || f.n) : ''; };
  function foodSearch(q, buy) {
    const toks = nrm(q).split(' ').filter(Boolean), out = [];
    for (const id in FOODS) {
      const f = FOODS[id], nm = nrm(foodName(id, buy) + ' ' + f.n), hay = nm + ' ' + nrm(f.kw || '');
      let score = 0, ok = true;
      for (const t of toks) {
        const vs = [t, sing(t), t.replace(/es$/, '')].filter(x => x.length >= 2);
        let best = 9;
        for (const v of vs) {
          if (nm.split(' ').some(w => w.indexOf(v) === 0)) best = Math.min(best, nm.indexOf(v) === 0 ? 0 : 1);
          else if (nm.indexOf(v) >= 0) best = Math.min(best, 2);
          else if (hay.split(' ').some(w => w.indexOf(v) === 0)) best = Math.min(best, 3);
          else if (t.length >= 4 && hay.indexOf(v) >= 0) best = Math.min(best, 4);
        }
        if (best === 9) { ok = false; break; }
        score += best;
      }
      if (ok) out.push({ id: id, score: score, name: foodName(id, buy) });
    }
    return out.sort((x, y) => x.score - y.score || x.name.localeCompare(y.name, 'es'));
  }

  function trendOf() {
    const ws = S.weights.slice().sort((a, b) => a.d < b.d ? -1 : a.d > b.d ? 1 : 0);
    if (!ws.length) return null;
    const last = ws[ws.length - 1], w = ws.filter(x => dayN(x.d) >= dayN(last.d) - 28), span = dayN(w[w.length - 1].d) - dayN(w[0].d);
    if (w.length < 4 || span < 10) return { ws: ws, last: last, ok: false, n: w.length, span: span };
    const xs = w.map(x => dayN(x.d) - dayN(w[0].d)), ys = w.map(x => x.kg), n = w.length;
    const mx = xs.reduce((a, b) => a + b, 0) / n, my = ys.reduce((a, b) => a + b, 0) / n;
    let num = 0, den = 0; for (let i = 0; i < n; i++) { num += (xs[i] - mx) * (ys[i] - my); den += (xs[i] - mx) * (xs[i] - mx); }
    return { ws: ws, last: last, ok: true, n: n, span: span, perWeek: den ? num / den * 7 : 0 };

  function adviceFor(tr, tg) {
    if (!tr || !tr.ok) return null;
    const s = tr.perWeek, w = tr.last.kg, meta = S.cfg.meta, pct = s / w * 100, rate = sgn(s, 2) + ' kg por semana';
    let delta = 0, why = '';
    if (meta === 'bajar') { if (s > -0.1) { delta = -150; why = 'Tu peso no está bajando (tendencia ' + rate + ').'; } else if (-pct > 1) { delta = 150; why = 'Estás bajando más rápido que 1 % de tu peso por semana (tendencia ' + rate + ').'; } }
    else if (meta === 'mantener') { if (Math.abs(s) > 0.25) { delta = s > 0 ? -150 : 150; why = 'Tu peso se mueve más de lo que buscas al mantener (tendencia ' + rate + ').'; } }
    else { if (s < 0.1) { delta = 150; why = 'Tu peso no está subiendo (tendencia ' + rate + ').'; } else if (s > 0.5) { delta = -150; why = 'Estás subiendo más rápido de lo planeado (tendencia ' + rate + ').'; } }
    if (!delta) return { good: true, txt: 'Tu tendencia (' + rate + ') va en línea con tu objetivo. No cambiaría nada.' };
    const nk = tg.k + delta;
    if (nk < 1400) return { txt: why + ' Tu meta ya está cerca del mínimo de 1,400 kcal, así que no te propongo bajarla más. Revisa tu actividad o consulta a un profesional de la salud.' };
    return { txt: why, delta: delta, nk: nk };
  }
  function weightChart(ws) {
    const w = ws.slice(-30);
    if (w.length < 2) return '';
    const W = 320, H = 140, pl = 34, pr = 8, pt = 10, pb = 22, d0 = dayN(w[0].d), d1 = dayN(w[w.length - 1].d) || d0 + 1;
    const lo = Math.min.apply(null, w.map(x => x.kg)) - 0.5, hi = Math.max.apply(null, w.map(x => x.kg)) + 0.5;
    const X = d => pl + (d1 === d0 ? 0.5 : (dayN(d) - d0) / (d1 - d0)) * (W - pl - pr), Y = k => pt + (hi - k) / (hi - lo) * (H - pt - pb);
    const pts = w.map(x => X(x.d).toFixed(1) + ',' + Y(x.kg).toFixed(1)).join(' ');
    const fmtD = iso => new Date(iso + 'T00:00:00').toLocaleDateString('es-MX', { day: 'numeric', month: 'short' });
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Gráfica de tu peso del ' + fmtD(w[0].d) + ' al ' + fmtD(w[w.length - 1].d) + ': de ' + fmtN(w[0].kg, 1) + ' a ' + fmtN(w[w.length - 1].kg, 1) + ' kg" style="width:100%;height:auto;display:block;margin:10px 0">' +
      '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + Y(hi).toFixed(1) + '" y2="' + Y(hi).toFixed(1) + '" stroke="var(--line)"/><line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + Y(lo).toFixed(1) + '" y2="' + Y(lo).toFixed(1) + '" stroke="var(--line)"/>' +
      '<text x="' + (pl - 4) + '" y="' + (Y(hi) + 4).toFixed(1) + '" text-anchor="end" font-size="10" fill="var(--muted)">' + fmtN(hi, 1) + '</text><text x="' + (pl - 4) + '" y="' + (Y(lo) + 4).toFixed(1) + '" text-anchor="end" font-size="10" fill="var(--muted)">' + fmtN(lo, 1) + '</text>' +
      '<polyline points="' + pts + '" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>' +
      w.map(x => '<circle cx="' + X(x.d).toFixed(1) + '" cy="' + Y(x.kg).toFixed(1) + '" r="3" fill="var(--accent)"/>').join('') +
      '<text x="' + pl + '" y="' + (H - 6) + '" font-size="10" fill="var(--muted)">' + fmtD(w[0].d) + '</text><text x="' + (W - pr) + '" y="' + (H - 6) + '" text-anchor="end" font-size="10" fill="var(--muted)">' + fmtD(w[w.length - 1].d) + '</text></svg>';
  }

  async function readTicket() {

  async function readTicketAI(files, text, sid) {
    if (tkBusy) return;
    const sm = await getSample(); const msg = qs('#tk-msg');
    if (!sm) { tkMsg = 'No encontré renglones con precio. Revisa que el texto incluya los precios, uno por renglón.'; render(); return; }
    tkText = text;
    if (!text && !files.length) { tkMsg = 'Sube una foto o pega el texto del ticket.'; msg.textContent = tkMsg; return; }
    let lim = null; try { lim = await sm.limits(); } catch (e) { lim = null; }
    if (files.length) {
      if (!lim || !lim.images) { msg.textContent = 'Aquí no se pueden enviar fotos. Pega el texto del ticket.'; return; }
      if (files.length > lim.images.maxCount) { msg.textContent = 'Máximo ' + lim.images.maxCount + ' fotos por vez.'; return; }
      const bad = files.find(f => f.size > lim.images.maxInputBytes || (lim.images.mediaTypes && lim.images.mediaTypes.indexOf(f.type) < 0));
      if (bad) { msg.textContent = 'Una foto es muy pesada o de un tipo que no acepto (' + (bad.type || 'desconocido') + ').'; return; }
    }
    tkBusy = true; qs('#tk-read').disabled = true; msg.textContent = 'Leyendo el ticket…';
    const catalog = Object.keys(FOODS).map(id => id + ' = ' + FOODS[id].n + ' (paquete de ' + FOODS[id].pack + ' g' + (FOODS[id].dry ? ', en gramos secos' : '') + ')').join('\n');
    const prompt = 'Lees tickets de supermercado, verdulería o abarrotes de México. ' + (files.length ? 'Las imágenes adjuntas son fotos del ticket. ' : '') + (text ? 'Texto del ticket:\n"""\n' + text + '\n"""\n' : '') +
      '\nExtrae solo los renglones que SÍ aparecen en el ticket; no inventes ninguno. Para cada renglón de comida intenta asociarlo con UN producto del catálogo usando su id exacto, o null si no corresponde claramente.\n\nCatálogo:\n' + catalog +
      '\n\nResponde SOLO con un objeto JSON sin texto adicional: {"total": número o null (el total del ticket), "lineas": [{"texto": "renglón tal como se lee, máximo 60 caracteres", "producto_id": "id del catálogo o null", "precio": importe en pesos de ese renglón, "gramos": gramos o mililitros totales comprados en ese renglón si el ticket los da o se deducen del empaque, si no null}]}';
    try {
      const r = await sm.json(prompt, Object.assign({ modelTier: 'default' }, files.length ? { images: files } : {}));
      const lines = (r && Array.isArray(r.lineas) ? r.lineas : []).slice(0, 60).map(x => {
        const id = x && FOODS[x.producto_id] ? x.producto_id : '', price = Number(x && x.precio), g = Number(x && x.gramos);
        return { t: String((x && x.texto) || '').slice(0, 60) || 'Renglón', id: id, price: price, g: isFinite(g) && g >= 5 && g <= 20000 ? Math.round(g) : null };
      }).filter(l => isFinite(l.price) && l.price > 0 && l.price < 5000);
      if (!lines.length) { tkMsg = 'No pude sacar renglones del ticket. Prueba con una foto más clara o pega el texto.'; tkBusy = false; render(); return; }
      lines.forEach(l => { l.per = l.id ? tkPer(l) : 0; l.use = !!l.id && isFinite(l.per) && l.per > 0; });
      const tot = Number(r && r.total);
      tkDraft = { store: sid, total: isFinite(tot) && tot > 0 && tot < 50000 ? Math.round(tot) : null, lines: lines };
      tkMsg = 'Leí ' + lines.length + ' renglones, ' + lines.filter(l => l.id).length + ' asociados a tu lista. Revisa antes de guardar.';
    } catch (e) {
      if (e && e.code === 'not_granted') tkMsg = 'No diste permiso para leer el ticket.';
      else if (e && e.code === 'rate_limited') tkMsg = 'Llegaste al límite de uso de Claude por ahora. Intenta más tarde.';
      else if (e && e.code === 'image_rejected') tkMsg = 'No pude abrir esa foto. Prueba con otra o pega el texto.';
      else if (e && e.code === 'invalid_json') tkMsg = 'No pude leer la respuesta. Intenta de nuevo o pega el texto del ticket.';
      else tkMsg = 'No pude leer el ticket ahora. Intenta de nuevo más tarde.';
    }
    tkBusy = false; render();
  }

  const qtxt = q => String(Math.round(q * 10) / 10).replace(/\.0$/, '');
  function estimateOut(di, slot) {

      case 'bk-check': {
        const txt = (qs('#bk-text').value || '').trim(), res = qs('#bk-res'), ap = qs('#bk-apply');
        ap.hidden = true; bkPending = null;
        if (!txt) { res.textContent = 'Elige un archivo o pega el texto del respaldo.'; break; }
        const r = parseBackup(txt);
        if (r.error) { res.textContent = r.error; break; }
        bkPending = r.data; res.textContent = r.summary + ' Si sigues, reemplazo todo lo que tienes ahora.'; ap.hidden = false; break;
      }
      case 'bk-apply': {
        if (!bkPending) break;
        const fresh = normalize(JSON.parse(JSON.stringify(bkPending)), false); if (!fresh) break;
        S.custom.forEach(c => unregisterCustom(c.id)); S.foods.forEach(f => unregisterFood(f.id));
        const n = normalize(JSON.parse(JSON.stringify(bkPending)), true);
        S = n; bkPending = null; open = new Set(); sel = Math.max(0, Math.min(6, dayIndexToday(S.week.start))); persist(); closeSheet(); route(); break;
      }
      case 'edit-price': editPrice = el.dataset.f; render(); { const i = qs('#pe-' + el.dataset.f); if (i) { i.focus(); i.select(); } } break;
      case 'cancel-price': editPrice = null; render(); break;
      case 'save-price': {
        const v = parseFloat(qs('#pe-' + el.dataset.f).value);
        const sid = el.dataset.sid || S.store;
        if (isFinite(v) && v >= 0) { S.prices[sid] = S.prices[sid] || {}; S.prices[sid][el.dataset.f] = Math.round(v); persist(); }
        editPrice = null; render(); break;
      }
      case 'clear-price': { const sid = el.dataset.sid || S.store; if (S.prices[sid]) delete S.prices[sid][el.dataset.f]; } editPrice = null; persist(); render(); break;
      case 'calibrate': {
        const t = parseFloat(qs('#ticket').value), sid = qs('#cal-store').value, nm = storeName(sid);
        if (!isFinite(t) || t <= 0) { calMsg = 'Escribe el total de tu ticket.'; render(); break; }
        const f = calibrateFactor(currentShop().filter(r => r.sid === sid), t);
        if (f === null) calMsg = 'No pude ajustar: el ticket es menor que los precios que ya fijaste en ' + nm + ', o no hay productos sin precio propio en esa tienda.';
        else { S.factors[sid] = f; persist(); calMsg = 'Listo: factor ×' + f.toFixed(2) + ' para ' + nm + '. Sus productos de esta lista suman cerca de ' + money(t) + '.'; }
        render(); break;
      }
      case 'add-stock': {
        const id = qs('#add-f').value, g = parseFloat(qs('#add-g').value);
        if (!FOODS[id]) { addG = qs('#add-g').value; pk = { ctx: 'add', q: '', isNew: false }; pickerSheet(); break; }
        if (isFinite(g) && g > 0) S.stock[id] = Math.round(g); else S.staples[id] = true;
        addPick = ''; addG = ''; S.example = false; persist(); render(); break;
      }
      case 'close-week': {
        const tg = targets(S.cfg), rows = currentShop(null, tg), prev = { stock: S.stock, week: S.week, bought: S.bought, example: S.example };
        S.stock = nextStock(rows, S.stock);
        S.week = blankWeek(); S.bought = {}; S.example = false; S.prevWeek = null; open = new Set(); sel = 0;
        S.undo = prev; persist(); render(); break;
      }
      case 'undo-close':
        if (S.undo) { S.stock = S.undo.stock; S.week = S.undo.week; S.bought = S.undo.bought; S.example = S.undo.example; S.undo = null; open = new Set(); sel = 0; persist(); render(); }
        break;
      case 'reset-factor': delete S.factors[el.dataset.sid || S.store]; persist(); calMsg = ''; render(); break;
    }
  }

  document.addEventListener('click', e => {
    const tg = e.target.closest('a[data-tgcopy]');
    if (tg) { const ta = qs('#share-text'); if (ta) { try { navigator.clipboard.writeText(ta.value).catch(() => {}); } catch (er) { /* sin portapapeles */ } } }
    const b = e.target.closest('button[data-act], a[data-act]');
    if (b) act(b.dataset.act, b);
  });
  document.addEventListener('change', e => {
    const t = e.target;
    if (t.id === 'bk-file' && t.files && t.files[0]) { const fr = new FileReader(); fr.onload = () => { const ta = qs('#bk-text'); if (ta) ta.value = String(fr.result || ''); }; fr.readAsText(t.files[0]); return; }
    if (t.dataset.act === 'cr-sum') { crSumUpdate(); return; }
    if (t.dataset.act === 'sh-cfg') { const ta = qs('#share-text'); if (ta) ta.value = planCode(t.checked); return; }
    if (t.dataset.pc) {
      const k = t.dataset.pc;
      if (k === 'myName') { S.myName = t.value.trim().slice(0, 30); persist(); return; }
      if (!S.partner) return;
      if (k === 'name') S.partner.name = t.value.trim().slice(0, 30) || 'Mi pareja';
      else if (k in NUMS && NUMS[k]) { const v = parseFloat(String(t.value).replace(',', '.')); if (isFinite(v)) S.partner.cfg[k] = Math.min(NUMS[k][1], Math.max(NUMS[k][0], v)); }
      else if (k === 'act') S.partner.cfg.act = Number(t.value);
      else S.partner.cfg[k] = t.value;
      persist(); render(); return;
    }
    if (t.dataset.act === 'tk-edit'  && tkDraft) {
      const l = tkDraft.lines[+t.dataset.i]; if (!l) return;
      if (t.dataset.k === 'use') l.use = t.checked;
      else if (t.dataset.k === 'id') { l.id = FOODS[t.value] ? t.value : ''; l.per = l.id ? tkPer(l) : 0; l.use = !!l.id && isFinite(l.per) && l.per > 0; }
      else if (t.dataset.k === 'per') { const v = parseFloat(t.value); l.per = isFinite(v) && v > 0 ? v : l.per; }
      render(); return;
    }
    if (t.dataset.cfg) { readCfg(t, true); persist(); if (view === 'ajustes') { const box = qs('#targets'); if (box) box.innerHTML = targetsHTML(); } render(); return; }
    switch (t.dataset.act) {
      case 'aisle-store': if (t.value) S.aisleStore[2] = t.value; else delete S.aisleStore[2]; calMsg = ''; persist(); render(); break;
      case 'store': S.store = t.value; if (S.aisleStore[2] === t.value) delete S.aisleStore[2]; editPrice = null; calMsg = ''; persist(); render(); break;
      case 'budget': { const v = parseFloat(t.value); S.budget = isFinite(v) && v >= 0 ? Math.round(v) : S.budget; persist(); render(); break; }
      case 'bought': S.bought[t.dataset.f] = t.checked; persist(); render(); break;
      case 'staple': if (t.checked) S.staples[t.dataset.f] = true; else delete S.staples[t.dataset.f]; S.example = false; persist(); render(); break;
      case 'stock': { const v = parseFloat(t.value); if (isFinite(v) && v > 0) S.stock[t.dataset.f] = Math.round(v); else delete S.stock[t.dataset.f]; S.example = false; persist(); render(); break; }
    }
  });
  document.addEventListener('input', e => {
    const t = e.target;
    if (t.dataset.act === 'glass') { const v = +t.value; glassApply(v); try { localStorage.setItem(GKEY, String(v)); } catch (er) { /* sin almacenamiento */ } return; }
    if (t.dataset.cfg && t.type !== 'checkbox' && t.tagName !== 'SELECT') {
      readCfg(t, false);
      const box = qs('#targets'); if (box) box.innerHTML = targetsHTML();
    }
    if (t.dataset.act === 'out-prev') outPreview(+t.dataset.d, t.dataset.s);
    if (t.dataset.act === 'cr-sum') crSumUpdate();
    if (t.dataset.act === 'pk-q' && pk) { pk.q = t.value; const box = qs('#pk-list'); if (box) { box.innerHTML = pkListHTML(); box.scrollTop = 0; } pkCount(); }
    if (t.dataset.act === 'sub-q') subFilter(t.value);
    if (t.dataset.act === 'tk-text') tkText = t.value;
    if (t.dataset.act === 'rec-q') { recQ = t.value; const box = qs('#rec-list'); if (box) box.innerHTML = recListHTML(); }
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !qs('#sheet').hidden) { if (pk) pkBack(); else closeSheet(); } });
  qs('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') closeSheet(); });
  window.addEventListener('hashchange', route);
  if (STANDALONE && 'serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => { /* sin modo sin conexión */ });
  document.addEventListener('submit', e => e.preventDefault());

  function readCfg(t, final) {
    const k = t.dataset.cfg;
    S.example = false;
    if (t.type === 'checkbox') {
      if (k === 'excl') { const set = new Set(S.cfg.excl); if (t.checked) set.add(t.value); else set.delete(t.value); S.cfg.excl = Array.from(set); }
      else S.cfg[k] = t.checked;
      return;
    }
    if (!(k in NUMS)) { S.cfg[k] = t.value; return; }
    if (t.value === '') {
      if (k === 'kOv' || k === 'pOv') S.cfg[k] = null;
      else if (final) t.value = S.cfg[k];
      return;
    }
    let v = parseFloat(String(t.value).replace(',', '.'));
    if (!isFinite(v)) return;
    const r = NUMS[k];
    if (r) { if (final) { v = Math.min(r[1], Math.max(r[0], v)); t.value = v; } else if (v < r[0] || v > r[1]) return; }
    S.cfg[k] = v;
  }

  route();
})();
</script>
</body></html>
